read_group_to_string:
  - name: valid_read_groups
    inputs:
      read_group:
        - ID: R1
          SM: sampleFoo
        - ID: R1
          SM: sampleFoo
          LB: spaces are allowed in LB
          BC: barcode with a space
          PU: platform_unit
          PL: ILLUMINA
          CN: center_name
          DT: date
          DS: description
          PI: 1
          PG: program_group
          PM: platform_model
          FO: ACMG
          KS: key_sequence
    assertions:
      outputs:
        validated_read_group:
          - Contains: R1
          - Contains: sampleFoo
        validated_read_group_array:
          - Defined: false
  - name: id_with_spaces
    inputs:
      read_group:
        - ID: ids should not have spaces # this is a problem
          SM: sample_a
          LB: library
          BC: barcode
          PU: platform_unit
          PL: ILLUMINA
          CN: center_name
          DT: date
          DS: description
          PI: 1
          PG: program_group
          PM: platform_model
          FO: ACMG
          KS: key_sequence
    assertions:
      should_fail: true
  - name: sample_with_spaces
    inputs:
      read_group:
        - ID: R123
          SM: samples should not have spaces
          LB: library can have spaces though
          BC: barcode
          PU: platform_unit
          PL: ILLUMINA
          CN: center_name
          DT: date
          DS: description
          PI: 1
          PG: program_group
          PM: platform_model
          FO: ACMG
          KS: key_sequence
    assertions:
      should_fail: true
  - name: spaces_allowed
    inputs:
      read_group:
        - ID: technically permissible but gross
          SM: same here!
      restrictive:
        - false
  - name: missing_sample
    inputs:
      read_group:
        - ID: R123
          LB: library
    assertions:
      should_fail: true
  - name: missing_sample_allowed
    inputs:
      read_group:
        - ID: R1
          LB: lib
      required_fields:
        - []
  - name: split_on_field
    inputs:
      read_group:
        - ID: R1
          SM: sampleFoo
      split_on_field:
        - true
    assertions:
      outputs:
        validated_read_group:
          - Defined: false
        validated_read_group_array:
          - Length: 2
          - First:
              StrEquals: "ID:R1"
          - Last:
              StrEquals: "SM:sampleFoo"

get_read_groups:
  - name: works
    inputs:
      bam:
        - bams/test.bwa_aln_pe.chrY_chrM.bam
        - bams/Aligned.sortedByCoord.chr9_chr22.bam
        - bams/test_rnaseq_variant.bam
        - bams/test.bam

inner_read_group_to_string:
  - name: space_delimited
    inputs:
      read_group:
        - ID: R1
          SM: sampleFoo
    assertions:
      outputs:
        stringified_read_group:
          - Defined: true
          - StrEquals: "ID:R1 SM:sampleFoo"
        read_group_array:
          - Defined: false
  - name: sam_record
    inputs:
      read_group:
        - ID: R1
          SM: sampleFoo
      format_as_sam_record:
        - true
    assertions:
      outputs:
        stringified_read_group:
          - Defined: true
          - Contains: "@RG"
          - Contains: "ID:R1"
          - Contains: "SM:sampleFoo"
        read_group_array:
          - Defined: false
  - name: split_on_field
    inputs:
      read_group:
        - ID: R1
          SM: sampleFoo
      split_on_field:
        - true
    assertions:
      outputs:
        stringified_read_group:
          - Defined: false
        read_group_array:
          - Defined: true
          - Length: 2
          - First:
              StrEquals: "ID:R1"
          - Last:
              StrEquals: "SM:sampleFoo"
  - name: sam_record_delimiter_with_split_on_field
    inputs:
      read_group:
        - ID: R1
          SM: sampleFoo
      format_as_sam_record:
        - true
      split_on_field:
        - true
    assertions:
      outputs:
        stringified_read_group:
          - Defined: false
        read_group_array:
          - Defined: true
          # `format_as_sam_record` takes precedence for delimiter selection, so
          # the tab-delimited content is still a single array element.
          - Length: 1
          - First:
              Contains: "@RG"
