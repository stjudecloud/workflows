name: Sprocket Test

on:
  workflow_call:

jobs:
  list-files:
    runs-on: ubuntu-latest
    outputs:
        files: ${{ steps.set-files.outputs.files }}
    steps:
        - uses: actions/checkout@v7
        - id: set-files
          run: echo "files=$(find . -name '*.wdl' -print -o -path "./template" -prune | jq -ncR '[inputs]')" >> $GITHUB_OUTPUT
  sprocket-test:
    needs: list-files
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.list-files.outputs.files) }}
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
      with:
        lfs: true
    - uses: stjude-rust-labs/setup-sprocket@v1
      with:
        github-token: ${{ github.token }}
    - name: Update containers
      run: |
        ./developer_scripts/update_container_tags.sh ${GITHUB_REF##*/}
    - name: Run sprocket test
      run: |
        sprocket test --clean-all --exclude-tag slow --exclude-tag high_mem --exclude-tag gpu ${{ matrix.file }}
