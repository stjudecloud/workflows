name: Workflows CD

on:
  push:
    branches:
      - main

jobs:
  gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          path: workflows
        uses: stjude-rust-labs/setup-sprocket@v1
        with:
          github-token: ${{ github.token }}
      - name: Build Docs
        run: |
          cd $GITHUB_WORKSPACE/workflows
          sprocket dev doc -v .
          cp -r assets docs/
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./workflows/docs
          # `gh-pages` only ever needs to serve the latest build; without
          # `force_orphan`, every push to `main` appends a full doc-site
          # rebuild to `gh-pages`'s history, which has bloated the branch to
          # multiple GB of near-duplicate generated HTML. Force-pushing a
          # single orphan commit each deploy keeps that branch's history flat.
          force_orphan: true
